name: Regbase
description: >-
  Regbase is an AI-native regulatory intelligence platform that helps legal teams,
  compliance professionals, researchers, and government vendors monitor new and
  proposed laws worldwide. The platform uses AI agents to identify regulatory
  changes across 195 countries and 50 US states, surfacing draft bills, consultations,
  compliance requirements, and opportunities like grants from hard-to-find government
  sources, non-English publications, and informal channels that traditional tools miss.
  Regbase then analyzes those changes automatically and alerts users to updates relevant
  to their practice areas, spanning employment and labor, AI governance, healthcare,
  privacy, climate and sustainability, government contracting, and other regulated
  industries. Founded in 2026 and part of Y Combinator's Spring 2026 batch, Regbase is
  based in San Francisco. This profile was surfaced as a Y Combinator portfolio company
  and enriched by the API Evangelist network; at the time of enrichment Regbase publishes
  a login-only web application and no public API, developer documentation, or SDK.
